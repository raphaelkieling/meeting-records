<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Record · Record Button Prototype</title>
<!-- Throwaway UI prototype comparing five Record placements with a simulated audio level. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #202124; background: #e8eaef; font: 14px system-ui, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid #3264c8; outline-offset: 3px; }
  .window { display: grid; grid-template-columns: minmax(136px, 240px) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) auto;
    width: min(1050px, calc(100% - 24px)); height: min(680px, calc(100dvh - 92px));
    margin: 24px auto 0; background: #fff; border: 1px solid #c9cdd6; border-radius: 13px;
    overflow: hidden; box-shadow: 0 12px 38px #22283a16; }
  aside { display: flex; flex-direction: column; min-height: 0; padding: 18px 12px;
    border-right: 1px solid #dedfe5; background: #f5f5f7; }
  .navigation { min-height: 0; overflow: auto; }
  nav { display: grid; gap: 4px; }
  nav button, .tabs button { border: 0; background: transparent; border-radius: 6px; padding: 8px 10px; }
  nav button { text-align: left; }
  nav button[data-recording] { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  [data-recording]::after { content: ""; flex: 0 0 8px; height: 8px;
    border-radius: 50%; background: #b42235;
    animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { from { box-shadow: 0 0 0 0 #b4223555; } to { box-shadow: 0 0 0 5px #b4223500; } }
  button[aria-current="page"], button[aria-selected="true"] { background: #e4ebfc; color: #174694; }
  aside h2 { margin: 22px 10px 6px; font-size: 12px; color: #555966; }
  main { padding: clamp(12px, 3vw, 32px); min-height: 0; display: flex; flex-direction: column; }
  main:has(#floating-action:not([hidden])) { position: relative; padding-bottom: 104px; }
  header { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
  h1 { font-size: clamp(20px, 3vw, 32px); letter-spacing: -.03em; margin: 0; }
  .tabs { display: flex; gap: 4px; margin-top: 18px; padding-bottom: 10px; border-bottom: 1px solid #dedfe5; }
  .tabs svg { vertical-align: -2px; margin-right: 5px; }
  #panel { flex: 1; min-height: 0; overflow: auto; color: #555966; }
  #panel li { padding: 12px 0; border-bottom: 1px solid #ececf0; }
  #panel ul { list-style: none; padding: 0; }
  #dock { text-align: center; border-top: 1px solid #dedfe5; padding-top: 16px; }
  #sidebar-action { margin-top: auto; border-top: 1px solid #dedfe5; padding-top: 12px; }
  #sidebar-action #controls { justify-items: stretch; }
  #footer-action { grid-column: 1 / -1; padding: 10px 16px; border-top: 1px solid #dedfe5; background: #f5f5f7; }
  #footer-action #controls { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 12px; }
  #footer-action #audio { margin-right: auto; }
  #controls { display: grid; justify-items: center; gap: 4px; }
  #record { background: #b42235; color: white; border: 0; border-radius: 7px; min-height: 44px; padding: 8px 14px; font-weight: 650; white-space: nowrap; }
  #dock #record { border-radius: 24px; padding: 11px 25px; }
  #record:disabled { background: #ececf0; color: #5e6068; cursor: default; }
  #floating-action { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); }
  #floating-action #controls { position: relative; display: flex; justify-content: flex-end;
    align-items: center; width: 50px; height: 50px; border-radius: 25px;
    background: #b42235; color: #fff; box-shadow: 0 4px 14px #292b3330;
    transition: width 190ms ease, background-color 190ms ease; }
  #floating-action[data-recording-active] #controls { width: 118px; background: #292b33; }
  #floating-action #controls:has(button:disabled) { background: #ececf0; }
  #floating-action #record { width: 50px; height: 50px; padding: 0; flex: none;
    border-radius: 50%; background: transparent; font-size: 21px; }
  #floating-action #record-label, #floating-action #audio > span:last-child { display: none; }
  #floating-action #audio { position: absolute; left: 18px; opacity: 0; pointer-events: none;
    transition: opacity 140ms ease; }
  #floating-action[data-recording-active] #audio { opacity: 1; }
  #floating-action .wave span { background: #fff; animation-play-state: paused; }
  #floating-action[data-recording-active] .wave span { animation-play-state: running; }
  #floating-action #reason { position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    width: max-content; margin-top: 4px; }
  #reason { color: #555966; font-size: 12px; text-align: center; max-width: 175px; }
  #reason:empty { display: none; }
  #audio { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; color: #555966; }
  .wave { display: flex; align-items: center; gap: 3px; height: 24px; }
  .wave span { width: 3px; height: 20px; border-radius: 3px; background: #b42235;
    transform: scaleY(var(--level)); animation: wave 650ms var(--delay) alternate infinite ease-in-out; }
  @keyframes wave { to { transform: scaleY(.18); } }
  @media (prefers-reduced-motion: reduce) {
    .wave span, [data-recording]::after { animation: none; }
    #floating-action #controls, #floating-action #audio { transition: none; }
  }
  .switcher { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; white-space: nowrap; gap: 10px; border-radius: 20px;
    padding: 4px; padding-inline: 6px; background: #292b33; color: #fff; font-size: 12px; }
  .switcher button { background: #454854; border: 0; border-radius: 14px; min-width: 28px; min-height: 26px; }
  [hidden] { display: none !important; }
</style>
<div class="window">
  <aside>
    <div class="navigation">
      <nav aria-label="Workspace"><button data-page="home">⌂ &nbsp; Home</button></nav>
      <h2>Meetings</h2>
      <nav aria-label="Meetings">
        <button data-page="recording">Quiet River</button>
        <button data-page="second">Bright Meadow</button>
        <button data-page="imported">Planning Notes</button>
      </nav>
    </div>
    <div id="sidebar-action"></div>
  </aside>
  <main>
    <header><h1 id="title"></h1><div id="header-action"></div></header>
    <div id="tabs" class="tabs" role="tablist" aria-label="Meeting content">
      <button id="inputs" role="tab" aria-controls="panel">
        <svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M2 9h3l1.5 2h3L11 9h3"/></svg>Inputs
      </button>
      <button id="transcription" role="tab" aria-controls="panel">Transcription</button>
    </div>
    <section id="panel" role="tabpanel" aria-live="polite"></section>
    <div id="dock"></div>
    <div id="floating-action" hidden></div>
  </main>
  <footer id="footer-action"></footer>
  <div id="controls">
    <div id="audio" hidden>
      <span class="wave" aria-hidden="true">
        <span style="--level:.36;--delay:-100ms"></span>
        <span style="--level:.72;--delay:-520ms"></span>
        <span style="--level:1;--delay:-230ms"></span>
        <span style="--level:.55;--delay:-800ms"></span>
        <span style="--level:.86;--delay:-390ms"></span>
        <span style="--level:.65;--delay:-960ms"></span>
        <span style="--level:.31;--delay:-700ms"></span>
      </span>
      <span>Simulated audio level</span>
    </div>
    <button id="record" aria-describedby="reason">
      <span id="record-icon" aria-hidden="true"></span>
      <span id="record-label"></span>
    </button>
    <span id="reason"></span>
  </div>
</div>
<div class="switcher" aria-label="Prototype layout">
  <button id="previous" aria-label="Previous layout">←</button>
  <span id="layout" aria-live="polite"></span>
  <button id="next" aria-label="Next layout">→</button>
</div>
<script>
  const byId = id => document.getElementById(id);
  const titles = { home: 'Home', recording: 'Quiet River', second: 'Bright Meadow', imported: 'Planning Notes' };
  const inputs = { recording: [], second: [], imported: ['Planning notes.vtt'] };
  const tabs = ['inputs', 'transcription'];
  const layouts = {
    A: ['dock', 'Bottom center'],
    B: ['header-action', 'Header action'],
    C: ['sidebar-action', 'Sidebar'],
    D: ['footer-action', 'Window footer'],
    E: ['floating-action', 'Floating Record']
  };
  const variants = Object.keys(layouts);
  let page = 'recording';
  let tab = 'inputs';
  let activeMeeting = null;
  const requestedVariant = new URLSearchParams(location.search).get('variant');
  let variant = variants.includes(requestedVariant) ? requestedVariant : 'A';

  function render() {
    const meeting = page !== 'home';
    const currentRecording = activeMeeting === page;
    const recordingElsewhere = activeMeeting && !currentRecording;
    const disabled = page === 'imported' || Boolean(recordingElsewhere);
    const [placement, name] = layouts[variant];
    byId('title').textContent = titles[page];
    byId('tabs').hidden = !meeting;
    for (const [id] of Object.values(layouts)) byId(id).hidden = !meeting || id !== placement;
    const target = byId(placement);
    if (byId('controls').parentElement !== target) target.append(byId('controls'));
    const record = byId('record');
    const recordLabel = currentRecording ? 'Stop Recording' : 'Record';
    record.disabled = disabled;
    record.setAttribute('aria-label', recordLabel);
    record.title = recordLabel;
    byId('record-icon').textContent = currentRecording ? '■' : '●';
    byId('record-label').textContent = recordLabel;
    byId('reason').textContent = recordingElsewhere ? 'Recording ' + titles[activeMeeting] + '.'
      : page === 'imported' ? 'This Meeting uses imported files.' : '';
    byId('floating-action').toggleAttribute('data-recording-active', currentRecording);
    byId('audio').hidden = !currentRecording && variant !== 'E';
    byId('audio').setAttribute('aria-hidden', !currentRecording || variant === 'E');
    byId('layout').textContent = 'Prototype ' + variant + ' · ' + name;

    document.querySelectorAll('[data-page]').forEach(button => {
      button.setAttribute('aria-current', button.dataset.page === page ? 'page' : 'false');
      const isRecording = button.dataset.page === activeMeeting;
      button.toggleAttribute('data-recording', isRecording);
      button.setAttribute('aria-label', isRecording ? titles[activeMeeting] + ', recording' : titles[button.dataset.page]);
    });
    for (const id of tabs) {
      byId(id).setAttribute('aria-selected', id === tab);
      byId(id).tabIndex = id === tab ? 0 : -1;
    }

    const panel = byId('panel');
    panel.setAttribute('role', meeting ? 'tabpanel' : 'region');
    panel.setAttribute('aria-labelledby', meeting ? tab : 'title');
    const message = {
      home: 'Your meeting workspace.',
      inputs: 'No inputs yet.',
      transcription: 'No transcription yet.'
    };
    if (meeting && tab === 'inputs' && inputs[page].length) {
      panel.innerHTML = '<ul>' + inputs[page].map(name => '<li>' + name + '</li>').join('') + '</ul>';
    } else {
      panel.innerHTML = '<p>' + message[meeting ? tab : 'home'] + '</p>';
    }
  }

  function stop() {
    const meetingInputs = inputs[activeMeeting];
    meetingInputs.push('Recording ' + (meetingInputs.length + 1));
    activeMeeting = null;
    render();
  }

  function switchLayout(direction) {
    const index = variants.indexOf(variant);
    variant = variants[(index + direction + variants.length) % variants.length];
    history.replaceState(null, '', '?variant=' + variant);
    render();
  }

  document.querySelectorAll('[data-page]').forEach(button => {
    button.onclick = () => { page = button.dataset.page; tab = 'inputs'; render(); };
  });
  for (const id of tabs) {
    byId(id).onclick = () => { tab = id; render(); };
  }
  byId('record').onclick = () => {
    if (activeMeeting) stop();
    else { activeMeeting = page; render(); }
  };
  byId('previous').onclick = () => switchLayout(-1);
  byId('next').onclick = () => switchLayout(1);
  document.addEventListener('keydown', event => {
    if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
    event.preventDefault();
    if (event.target.closest('[role="tablist"]')) {
      tab = tab === 'inputs' ? 'transcription' : 'inputs';
      render();
      byId(tab).focus();
    } else switchLayout(event.key === 'ArrowLeft' ? -1 : 1);
  });
  render();
</script>
</html>
